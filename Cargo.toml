[package]
name = "ldapin"
version = "0.1.1"
edition = "2024"
description = "Discover valid LDAP fields from server schema"

[dependencies]
ldap3 = { version = "0.11", default-features = false, features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comfy-table = "7"
tokio = { version = "1", features = ["full"] }
