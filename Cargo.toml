[package]
name = "ldapin"
version = "0.1.2"
edition = "2024"
description = "Discover valid LDAP fields from server schema"
authors = ["Fabian Affolter <fabian.affolter@gmail.com>"]
license = "MIT"
repository = "https://github.com/fabaff/ldapin"
homepage = "https://github.com/fabaff/ldapin"
documentation = "https://docs.rs/ldapin"
keywords = ["ldap", "schema", "discovery", "directory"]
categories = ["command-line-utilities", "network-programming"]
readme = "README.md"

[dependencies]
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
comfy-table = "8"
tokio = { version = "1", features = ["full"] }
